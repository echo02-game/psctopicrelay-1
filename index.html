<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普通話水平測試 - 命題說話練習</title>
    <style>
        :root {
            --primary: #2C7A7B;
            --primary-light: #4FD1C5;
            --secondary: #E6FFFA;
            --text-main: #2D3748;
            --text-light: #718096;
            --bg-color: #F7FAFC;
            --white: #FFFFFF;
            --danger: #E53E3E;
            --warning: #DD6B20;
            --success: #38A169;
        }

        body {
            font-family: 'Yuanti SC', 'YouYuan', 'STYuanti', '幼圆', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .pinyin {
            font-family: 'Calibri', sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px 20px 20px; /* 增加上方留白，避免按鈕遮擋文字 */
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            width: 100%;
        }

        /* 登錄頁面 */
        #login-page {
            text-align: center;
            background: var(--white);
            padding: 40px 20px; /* Reduced side padding */
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            margin: auto;
            width: 100%;
            box-sizing: border-box; /* Prevents padding from causing overflow */
        }

        .header-title-small {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .header-title-main {
            font-size: 1.8rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 15px;
            font-family: inherit;
        }

        .btn:hover {
            background-color: #285E61;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--secondary);
        }

        .footer {
            text-align: center; /* Better for mobile */
            color: gray;
            font-size: 0.85rem;
            padding: 20px;
            margin-top: auto; /* Pushes it to the bottom of the flex container */
            width: 100%;
            box-sizing: border-box;
        }
        @media (min-width: 601px) {
            .footer {
                text-align: right;
                padding-right: 20px;
            }
        }

        /* 隱藏元素 */
        .hidden {
            display: none !important;
        }

        /* 設定頁 */
        #setup-page {
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .setup-desc {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .member-setup {
            margin: 20px 0;
            text-align: left;
        }

        select {
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #E2E8F0;
            font-size: 1rem;
            font-family: inherit;
        }

        .names-container {
            margin-top: 15px;
            display: grid;
            gap: 10px;
        }

        .btn-small {
            background-color: var(--secondary);
            color: var(--primary);
            border: 1px solid var(--primary-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 10px;
        }

        /* 選題頁 */
        #topic-page {
            text-align: center;
        }

        .topic-cards {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .topic-card {
            background: var(--white);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            flex: 1;
            min-width: 250px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .topic-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .topic-id {
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .topic-name {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 15px 0;
            font-weight: bold;
        }

        .order-list {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .order-badge {
            display: inline-block;
            background: var(--secondary);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9rem;
        }

        /* 接力頁 */
        #relay-page {
            text-align: center;
            background: var(--white);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .fixed-topic {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .speaker-info {
            margin: 20px 0;
        }

        .current-speaker {
            font-size: 3.5rem;
            color: var(--primary);
            font-weight: bold;
            margin: 10px 0;
        }

        .next-speaker {
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .timer-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
        }

        .timer-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 15px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: border-color 0.5s;
        }

        .timer-text {
            font-size: 4rem;
            font-weight: bold;
            font-family: 'Calibri', sans-serif;
        }

        .timer-safe { border-color: var(--success); color: var(--success); }
        .timer-warn { border-color: var(--warning); color: var(--warning); }
        .timer-danger { border-color: var(--danger); color: var(--danger); }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .controls .btn {
            width: auto;
            margin-top: 0;
        }

        .outline-hint {
            background: #FFFFAF;
            padding: 15px;
            border-radius: 8px;
            margin: 10px auto 20px auto;
            max-width: 600px;
            font-size: 1.2rem;
            border-left: 5px solid #D69E2E;
            text-align: left;
        }

        .progress-bar {
            display: flex;
            gap: 5px;
            margin-top: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .progress-item {
            flex: 1;
            text-align: center;
            padding: 10px 5px;
            background: var(--bg-color);
            border-radius: 8px;
            font-size: 0.9rem;
            min-width: 60px;
        }

        .progress-item.done {
            opacity: 0.5;
        }

        .progress-item.active {
            background: var(--primary-light);
            color: white;
            font-weight: bold;
            transform: scale(1.05);
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .toggle-btn {
            background: none;
            border: 1px solid var(--text-light);
            border-radius: 20px;
            padding: 5px 15px;
            color: var(--text-light);
            cursor: pointer;
            font-family: inherit;
        }

        .toggle-btn.active {
            background: var(--secondary);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* 過場動畫 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 122, 123, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .transition-overlay.show {
            opacity: 1;
        }

        /* 完成頁面 */
        #finish-page {
            text-align: center;
            background: var(--white);
            padding: 50px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .finish-title {
            font-size: 2.5rem;
            color: var(--success);
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .topic-cards {
                flex-direction: column;
            }
            .current-speaker {
                font-size: 2.5rem;
            }
            .timer-container {
                width: 150px;
                height: 150px;
            }
            .timer-text {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    
    <a href="https://echo02-game.github.io/pttcgamehub/" class="btn-return" style="position: absolute; top: 15px; left: 15px; text-decoration: none; background: #E6FFFA; color: #2C7A7B; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; border: 1px solid #4FD1C5; z-index: 1000;">返回普通話自修室</a>
    <div class="container">
        <!-- 登錄頁面 -->
        <div id="login-page">
            <div class="header-title-small">普通話水平測試</div>
            <h1 class="header-title-main">命題說話練習——話題接力</h1>
            <p>請輸入名字與密碼開始練習</p>
            <input type="text" id="login-name" placeholder="您的名字">
            <input type="password" id="login-pwd" placeholder="密碼">
            <button class="btn" id="login-btn">進入</button>
            <p id="login-error" style="color: var(--danger); display: none;">請輸入正確密碼</p>
        </div>

        <!-- 首頁 / 設定頁 -->
        <div id="setup-page" class="hidden">
            <h1 class="header-title-main" style="margin-bottom: 10px;">普通話命題說話【話題接力】</h1>
            
            <p class="setup-desc">抽題、選題、輪流接力說話</p>

            <div class="mode-setup" style="margin: 20px 0; text-align: left; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                <label style="font-weight: bold; display: block; margin-bottom: 10px;">選擇抽題模式：</label>
                <div style="margin-bottom: 15px; display: flex; gap: 15px;">
                    <label class="mode-label active">
                        <input type="radio" name="draw-mode" value="random" checked style="display: none;"> 隨機分配
                    </label>
                    <label class="mode-label">
                        <input type="radio" name="draw-mode" value="category" style="display: none;"> 按類別選題
                    </label>
                </div>
                <style>
                    .mode-label {
                        padding: 8px 18px;
                        border-radius: 20px;
                        background: #E2E8F0;
                        color: #4A5568;
                        cursor: pointer;
                        font-weight: bold;
                        transition: all 0.2s;
                        border: 2px solid transparent;
                    }
                    .mode-label:hover {
                        background: #CBD5E0;
                    }
                    .mode-label.active {
                        background: var(--secondary);
                        color: var(--primary);
                        border-color: var(--primary);
                    }
                </style>
                <div id="category-select-container" class="hidden">
                    <select id="topic-category" style="width: 100%; margin-top: 5px;">
                        <option value="1">第一類：人物篇</option>
                        <option value="2">第二類：事物篇</option>
                        <option value="3">第三類：經歷和生活</option>
                        <option value="4">第四類：理想和願望</option>
                        <option value="5">第五類：觀點和評論</option>
                    </select>
                </div>
            </div>


            <div class="member-setup">
                <label>選擇組員人數：</label>
                <select id="member-count">
                    <option value="1">1 人</option>
                    <option value="2">2 人</option>
                    <option value="3" selected>3 人</option>
                    <option value="4">4 人</option>
                    <option value="5">5 人</option>
                </select>
                <button class="btn-small" id="default-names-btn">一鍵填入預設名字</button>

                <div class="names-container" id="names-inputs">
                    <!-- 動態生成輸入框 -->
                </div>
            </div>

            <button class="btn" id="start-draw-btn">開始抽題</button>
        </div>

        <!-- 選題頁 -->
        <div id="topic-page" class="hidden">
            <h2>請選擇本輪題目</h2>

            <div class="order-list">
                <strong>本組發言次序：</strong>
                <div id="order-display" style="margin-top: 10px;"></div>
            </div>

            <div class="topic-cards" id="topic-cards-container">
                <!-- 動態生成題目卡 -->
            </div>

            <div style="margin-top: 20px;">
                <button class="btn btn-outline" id="redraw-btn" style="width: auto; margin-right: 10px;">重新抽題</button>
                <button class="btn btn-outline" id="back-setup-btn" style="width: auto;">返回設定</button>
            </div>
        </div>

        
        <!-- 準備頁 -->
        <div id="prep-page" class="hidden" style="text-align: center; background: var(--white); padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); max-width: 700px; margin: 0 auto;">
            <h2 style="color: var(--primary);">發言分配與準備</h2>
            <div class="fixed-topic" id="prep-topic-title" style="margin-bottom: 10px;">題目</div>
            <p style="color: var(--text-light); font-size: 1.1rem; margin-bottom: 20px;">按下“開始準備”後，請根據説話提示用60秒準備説話内容。</p>

            <div class="timer-container" style="width: 150px; height: 150px; margin: 15px auto;">
                <div class="timer-circle timer-safe" id="prep-timer-circle" style="border-width: 12px;">
                    <div class="timer-text" id="prep-timer-text" style="font-size: 3.5rem;">60</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="start-prep-btn" style="width: 150px;">開始準備</button>
                <button class="btn btn-outline" id="start-relay-btn" style="width: 150px;">開始說話</button>
            </div>

            <div class="order-list" style="margin-top: 25px; background: #F7FAFC; border: 1px solid #E2E8F0;">
                <div id="prep-allocation-list" style="text-align: left; font-size: 1.05rem; line-height: 1.5;"></div>
            </div>
        </div>

        <!-- 接力頁 -->
        <div id="relay-page" class="hidden">
            <div class="top-controls">
                <div>
                    <button class="toggle-btn" id="sound-toggle">靜音模式</button>
                    <button class="toggle-btn active" id="hint-toggle">顯示提示</button>
                </div>
                <button class="toggle-btn" id="restart-all-btn">重新開始全部</button>
            </div>

            <div class="fixed-topic" id="relay-topic-title">題目載入中...</div>

            <div class="speaker-info">
                <div style="color: var(--text-light);">
                    第 <span id="current-speaker-idx">1</span> 位 / 共 <span id="total-speakers">3</span> 位
                    <span id="role-badge" style="background: var(--primary-light); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; margin-left: 5px;">開頭</span>
                </div>
                <div class="current-speaker" id="relay-current-speaker">姓名</div>

            <div class="outline-hint" id="outline-hint">
                提示內容載入中...
            </div>
                <div class="next-speaker" id="relay-next-speaker">下一位：準備中</div>
            </div>

            <div class="timer-container">
                <div class="timer-circle timer-safe" id="timer-circle">
                    <div class="timer-text" id="timer-text">30</div>
                </div>
            </div>

            <div id="pause-indicator" class="hidden" style="color: var(--warning); font-weight: bold; font-size: 1.2rem; margin-bottom: 10px;">已暫停</div>

            <div class="controls">
                <button class="btn" id="play-pause-btn" style="width: 150px;">開始</button>
                <button class="btn btn-outline" id="skip-btn">跳到下一位</button>
                <button class="btn btn-outline" id="reset-round-btn">重設本輪</button>
            </div>

            <div class="progress-bar" id="progress-bar">
                <!-- 動態生成進度 -->
            </div>
        </div>

        <!-- 完成頁面 -->
        <div id="finish-page" class="hidden">
            <div class="finish-title">🎉 本輪完成！</div>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">恭喜全組完成話題接力訓練</p>

            <div style="display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto;">
                <button class="btn" id="play-again-btn">同題再玩一次</button>
                <button class="btn btn-outline" id="draw-new-btn">再抽新題</button>
                <button class="btn btn-outline" style="border-color: #E2E8F0; color: var(--text-light);" id="finish-to-home-btn">回到首頁</button>
            </div>
        </div>
    </div>

    <div class="transition-overlay" id="transition-overlay">
        下一位：<span id="transition-name"></span>
    </div>

    <div class="footer">
        網頁僅供機構内部使用。普通話培訓測試中心版權所有。
    </div>

        // 音效系統
                function playBeep() {
            if (!state.soundEnabled) return;

            if (!state.audioCtx) {
                state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }

            const oscillator = state.audioCtx.createOscillator();
            const gainNode = state.audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, state.audioCtx.currentTime); // A5

            gainNode.gain.setValueAtTime(0.1, state.audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, state.audioCtx.currentTime + 0.5);

            oscillator.connect(gainNode);
            gainNode.connect(state.audioCtx.destination);

            oscillator.start();
            oscillator.stop(state.audioCtx.currentTime + 0.5);
        }

            const inputs = document.querySelectorAll('.member-name-input');
            const letters = ['A', 'B', 'C', 'D', 'E'];
            state.members = Array.from(inputs).map((input, idx) => {
                return input.value.trim() || `同學 ${letters[idx]}`;
            });
        }

        // 隨機打亂陣列
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        
        // 分配角色與時間
        function assignRoles() {
            const members = [...state.members];
            shuffleArray(members);

            state.order = [];
            const n = members.length;

            // 時間分配: 開頭30s, 主體一50s, 主體二50s, 主體三35s, 結語15s
            if (n === 5) {
                state.order.push({ name: members[0], role: '開頭', time: 30, hintIdxs: [0] });
                state.order.push({ name: members[1], role: '主體一', time: 50, hintIdxs: [1] });
                state.order.push({ name: members[2], role: '主體二', time: 50, hintIdxs: [2] });
                state.order.push({ name: members[3], role: '主體三', time: 35, hintIdxs: [3] });
                state.order.push({ name: members[4], role: '結語', time: 15, hintIdxs: [4] });
            } else if (n === 4) {
                state.order.push({ name: members[0], role: '開頭', time: 30, hintIdxs: [0] });
                state.order.push({ name: members[1], role: '主體一', time: 50, hintIdxs: [1] });
                state.order.push({ name: members[2], role: '主體二', time: 50, hintIdxs: [2] });
                state.order.push({ name: members[3], role: '主體三及結語', time: 50, hintIdxs: [3, 4] });
            } else if (n === 3) {
                state.order.push({ name: members[0], role: '開頭及主體一', time: 80, hintIdxs: [0, 1] });
                state.order.push({ name: members[1], role: '主體二', time: 50, hintIdxs: [2] });
                state.order.push({ name: members[2], role: '主體三及結語', time: 50, hintIdxs: [3, 4] });
            } else if (n === 2) {
                state.order.push({ name: members[0], role: '開頭及主體一', time: 80, hintIdxs: [0, 1] });
                state.order.push({ name: members[1], role: '主體二、三及結語', time: 100, hintIdxs: [2, 3, 4] });
            } else if (n === 1) {
                state.order.push({ name: members[0], role: '全部', time: 180, hintIdxs: [0, 1, 2, 3, 4] });
            }

            // 顯示次序
            els.orderDisplay.innerHTML = state.order.map((item, idx) => 
                `<span class="order-badge">${idx + 1}. ${item.name} (${item.role})</span>`
            ).join('');
        }

        // 抽題邏輯
        
        function drawTopics() {
            let pool = topicsData;

            // 根據模式篩選題目池
            const mode = document.querySelector('input[name="draw-mode"]:checked').value;
            if (mode === 'category') {
                const cat = els.topicCategory.value;
                const catIds = categories[cat];
                pool = topicsData.filter(t => catIds.includes(t.id));
            }

            if (pool.length < 2) pool = topicsData; // 防錯機制

            // 隨機選兩個不重複的題目
            const t1Idx = Math.floor(Math.random() * pool.length);
            let t2Idx = Math.floor(Math.random() * pool.length);
            while (t2Idx === t1Idx && pool.length > 1) {
                t2Idx = Math.floor(Math.random() * pool.length);
            }

            const t1 = pool[t1Idx];
            const t2 = pool[t2Idx];

            els.topicCardsContainer.innerHTML = '';

            [t1, t2].forEach(topic => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.innerHTML = `
                    <div class="topic-id">話題 ${topic.id}</div>
                    <div class="topic-name">${topic.name}</div>
                    <button class="btn select-topic-btn" data-id="${topic.id}">選這題</button>
                `;

                card.querySelector('button').addEventListener('click', () => {
                    selectTopic(topic);
                });

                els.topicCardsContainer.appendChild(card);
            });

            assignRoles(); // 先隨機分配角色
            showPage('topic');
        }

        function selectTopic(topic) {
            state.currentTopic = topic;
            assignRoles(); // 重新分配角色以適應大綱長度
            setupPrep();
            showPage('prep');
        }

        // 準備邏輯
        function setupPrep() {
            state.prepTimeLeft = 60;
            clearInterval(state.prepTimer);
            els.prepTopicTitle.textContent = `${state.currentTopic.id}. ${state.currentTopic.name}`;
            els.prepTimerText.textContent = state.prepTimeLeft;
            els.prepTimerCircle.className = 'timer-circle timer-safe';

            // Build allocation list
            const hints = state.currentTopic.outline;
            let html = "";
            state.order.forEach((item, idx) => {
                const currentHints = item.hintIdxs.map(i => hints[i] || "自由發揮");
                html += `<div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #E2E8F0;">
                            <strong style="color: var(--primary); font-size: 1.1rem;">${idx + 1}. ${item.name} (${item.role} - ${item.time}秒)</strong><br>
                            <span style="color: var(--text-main);">${currentHints.join('<br>')}</span>
                         </div>`;
            });
            els.prepAllocationList.innerHTML = html;

            els.startPrepBtn.disabled = false;
            els.startPrepBtn.textContent = '開始準備';
        }

        function startPrepCountdown() {
            if (state.prepTimer) clearInterval(state.prepTimer);

            if (state.soundEnabled && (!state.audioCtx || state.audioCtx.state === 'suspended')) {
                if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                state.audioCtx.resume();
            }

            els.startPrepBtn.disabled = true;
            els.startPrepBtn.textContent = '準備中...';

            state.prepTimer = setInterval(() => {
                state.prepTimeLeft--;
                els.prepTimerText.textContent = state.prepTimeLeft;

                if (state.prepTimeLeft <= 10) els.prepTimerCircle.className = 'timer-circle timer-warn';
                if (state.prepTimeLeft <= 5) els.prepTimerCircle.className = 'timer-circle timer-danger';

                if (state.prepTimeLeft <= 0) {
                    clearInterval(state.prepTimer);
                    playBeep();
                    finishPrep();
                }
            }, 1000);
        }

        function finishPrep() {
            clearInterval(state.prepTimer);
            setupRelay();
            showPage('relay');
        }

        // 接力邏輯
        function setupRelay() {
            state.currentSpeakerIndex = 0;
            els.relayTopicTitle.textContent = `${state.currentTopic.id}. ${state.currentTopic.name}`;
            els.totalSpeakers.textContent = state.order.length;

            buildProgressBar();
            updateSpeakerDisplay();
        }

        function buildProgressBar() {
            els.progressBar.innerHTML = '';
            state.order.forEach((item, idx) => {
                const el = document.createElement('div');
                el.className = 'progress-item';
                el.innerHTML = `<strong>${idx + 1}</strong><br>${item.name}`;
                els.progressBar.appendChild(el);
            });
        }

        function updateSpeakerDisplay() {
            const current = state.order[state.currentSpeakerIndex];

            els.currentSpeakerIdx.textContent = state.currentSpeakerIndex + 1;
            els.roleBadge.textContent = current.role;
            els.relayCurrentSpeaker.textContent = current.name;

            if (state.currentSpeakerIndex < state.order.length - 1) {
                els.relayNextSpeaker.textContent = `下一位：${state.order[state.currentSpeakerIndex + 1].name}`;
            } else {
                els.relayNextSpeaker.textContent = "這是最後一位";
            }

            
            // 提示大綱
            if (state.currentTopic && state.currentTopic.outline) {
                const hints = state.currentTopic.outline;
                // 使用 assignRoles 裡設定好的 hintIdxs 來對應顯示第幾條大綱
                const currentHints = current.hintIdxs.map(i => hints[i] || "自由發揮");
                const hintText = currentHints.join('<br>');

                els.outlineHint.innerHTML = `<strong>說話提示：</strong><br>${hintText}`;
            }

            // 進度條

            const items = els.progressBar.querySelectorAll('.progress-item');
            items.forEach((item, idx) => {
                item.className = 'progress-item';
                if (idx < state.currentSpeakerIndex) item.classList.add('done');
                else if (idx === state.currentSpeakerIndex) item.classList.add('active');
            });

            // 時間設定
            state.totalTime = current.time;
            state.timeLeft = current.time;
            updateTimerDisplay();

            // 重置按鈕狀態
            state.isPlaying = false;
            els.playPauseBtn.textContent = '開始';
            els.pauseIndicator.classList.add('hidden');

            clearInterval(state.timer);
        }

        function updateTimerDisplay() {
            els.timerText.textContent = state.timeLeft;

            // 顏色變化
            els.timerCircle.className = 'timer-circle';
            if (state.timeLeft <= 5) {
                els.timerCircle.classList.add('timer-danger');
            } else if (state.timeLeft <= 10) {
                els.timerCircle.classList.add('timer-warn');
            } else {
                els.timerCircle.classList.add('timer-safe');
            }
        }

        function toggleTimer() {
            if (state.isPlaying) {
                // 暫停
                clearInterval(state.timer);
                state.isPlaying = false;
                els.playPauseBtn.textContent = '繼續';
                els.pauseIndicator.classList.remove('hidden');
            } else {
                // 開始
                state.isPlaying = true;
                els.playPauseBtn.textContent = '暫停';
                els.pauseIndicator.classList.add('hidden');

                // AudioContext 需要使用者互動後才能啟動
                if (state.soundEnabled && (!state.audioCtx || state.audioCtx.state === 'suspended')) {
                    if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    state.audioCtx.resume();
                }

                state.timer = setInterval(() => {
                    state.timeLeft--;
                    updateTimerDisplay();

                    if (state.timeLeft <= 0) {
                        clearInterval(state.timer);
                        playBeep();
                        nextSpeaker();
                    }
                }, 1000);
            }
        }

        function nextSpeaker() {
            clearInterval(state.timer);

            if (state.currentSpeakerIndex < state.order.length - 1) {
                // 過場動畫
                const nextName = state.order[state.currentSpeakerIndex + 1].name;
                els.transitionName.textContent = nextName;
                els.transitionOverlay.classList.add('show');

                setTimeout(() => {
                    els.transitionOverlay.classList.remove('show');
                    state.currentSpeakerIndex++;
                    updateSpeakerDisplay();
                    // 自動開始下一位
                    setTimeout(toggleTimer, 500);
                }, 2000);
            } else {
                // 完成
                showPage('finish');
            }
        }

        // 事件監聽
        function setupEventListeners() {
            // Login
            els.loginBtn.addEventListener('click', () => {
                if (els.loginPwd.value === 'vtcpsc') {
                    showPage('setup');
                } else {
                    els.loginError.style.display = 'block';
                }
            });

            els.loginPwd.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') els.loginBtn.click();
            });

            // Setup

            

            // Mode Select
            els.drawModeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Update active styles
                    document.querySelectorAll('.mode-label').forEach(label => label.classList.remove('active'));
                    if (e.target.parentElement.classList.contains('mode-label')) {
                        e.target.parentElement.classList.add('active');
                    }

                    // Toggle dropdown
                    if (e.target.value === 'category') {
                        els.categorySelectContainer.classList.remove('hidden');
                    } else {
                        els.categorySelectContainer.classList.add('hidden');
                    }
                });
            });
            els.memberCount.addEventListener('change', updateNameInputs);
            els.defaultNamesBtn.addEventListener('click', fillDefaultNames);
            els.startDrawBtn.addEventListener('click', () => {
                gatherMembers();
                drawTopics();
            });

            // Topic
            els.redrawBtn.addEventListener('click', drawTopics);
            els.backSetupBtn.addEventListener('click', () => showPage('setup'));

            
            // Prep Controls
            els.startPrepBtn.addEventListener('click', startPrepCountdown);
            els.startRelayBtn.addEventListener('click', finishPrep);

            // Relay Controls
            els.playPauseBtn.addEventListener('click', toggleTimer);
            els.skipBtn.addEventListener('click', nextSpeaker);
            els.resetRoundBtn.addEventListener('click', () => {
                clearInterval(state.timer);
                setupRelay();
            });


            // Toggles
            els.soundToggle.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                els.soundToggle.classList.toggle('active', state.soundEnabled);
                els.soundToggle.textContent = state.soundEnabled ? '有聲提示' : '靜音模式';

                if (state.soundEnabled) {
                    if (!state.audioCtx) {
                        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (state.audioCtx.state === 'suspended') {
                        state.audioCtx.resume();
                    }

                    // 播放一聲測試音效，同時解鎖 iOS 的音頻限制
                    const oscillator = state.audioCtx.createOscillator();
                    const gainNode = state.audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(state.audioCtx.destination);
                    gainNode.gain.value = 0.01; // 非常小聲
                    oscillator.start();
                    oscillator.stop(state.audioCtx.currentTime + 0.1);
                }
            });


            els.hintToggle.addEventListener('click', () => {
                state.hintsEnabled = !state.hintsEnabled;
                els.hintToggle.classList.toggle('active', state.hintsEnabled);
                els.hintToggle.textContent = state.hintsEnabled ? '顯示提示' : '隱藏提示';
                els.outlineHint.style.display = state.hintsEnabled ? 'block' : 'none';
            });

            els.restartAllBtn.addEventListener('click', () => {
                clearInterval(state.timer);
                showPage('setup');
            });

            // Finish
            els.playAgainBtn.addEventListener('click', () => {
                setupRelay();
                showPage('relay');
            });

            els.drawNewBtn.addEventListener('click', drawTopics);
            els.finishToHomeBtn.addEventListener('click', () => showPage('setup'));
        }

        // 啟動
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
